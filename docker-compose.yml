services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/payments
      API_KEY: test-api-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENTS_QUEUE: payments.new
      PAYMENTS_DLQ: payments.new.dlq
    ports:
      - "8000:8000"
    restart: on-failure

  worker:
    build: .
    command: python -m app.workers.outbox_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENTS_QUEUE: payments.new
      PAYMENTS_DLQ: payments.new.dlq
    restart: on-failure

  consumer:
    build: .
    command: python -m app.consumers.payment_consumer
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/payments
      PAYMENTS_QUEUE: payments.new
      PAYMENTS_DLQ: payments.new.dlq
    restart: on-failure
